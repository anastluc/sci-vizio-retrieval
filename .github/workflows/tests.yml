name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sci
          POSTGRES_PASSWORD: sci
          POSTGRES_DB: sci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sci -d sci_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      SCI_TEST_POSTGRES_DSN: postgresql://sci:sci@localhost:5432/sci_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # Tests use fake embedders/vision/auth/billing, so torch and model downloads aren't needed.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,saas]" chromadb gradio
      - name: Lint
        run: ruff check sci_vizio_retrieval sci_vizio_saas tests
      - name: Test
        run: pytest --cov=sci_vizio_retrieval --cov=sci_vizio_saas --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
