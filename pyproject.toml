[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sci-vizio-retrieval"
version = "0.2.0"
description = "Extract, describe (vision LLMs), index and semantically search images from scientific PDFs."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Lucas Anastasiou" }]
dependencies = [
    "PyMuPDF>=1.24.3",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "openai>=1.0",
    "python-dotenv",
    "tqdm",
]

[project.optional-dependencies]
# ResNet-50 image embeddings stored during the `process` stage
ml = ["torch>=2.0.0", "torchvision"]
# ChromaDB vector store (default backend); open-clip powers image embeddings
chroma = ["chromadb>=0.5", "open-clip-torch"]
# PostgreSQL + pgvector vector store
postgres = ["psycopg[binary]>=3.1", "pgvector>=0.3", "sentence-transformers>=2.7"]
ui = ["gradio>=4.0"]
# Multi-user web app (FastAPI API + worker); see requirements-saas.txt and docs/DEPLOYMENT.md
saas = [
    "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "alembic>=1.13",
    "psycopg[binary]>=3.1", "pgvector>=0.3", "pydantic-settings>=2.4", "firebase-admin>=6.5",
    "boto3>=1.34", "stripe>=10.0", "fastembed>=0.4",
]
all = ["sci-vizio-retrieval[ml,chroma,postgres,ui,saas]"]
dev = ["pytest>=8", "pytest-cov", "ruff", "httpx", "moto[s3]>=5"]

[project.scripts]
sci-vizio = "sci_vizio_retrieval.cli:main"

[tool.setuptools.packages.find]
include = ["sci_vizio_retrieval*", "sci_vizio_saas*"]

[tool.setuptools.package-data]
sci_vizio_saas = ["alembic.ini", "migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "postgres: needs a PostgreSQL server with pgvector (set SCI_TEST_POSTGRES_DSN)",
]
filterwarnings = [
    "ignore::DeprecationWarning:chromadb.*",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks", "BKPs", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "W291", "W293", "B904"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are meant to be used as defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]
